<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b0f16">
<title>汐 · 通话</title>
<style>
  :root{ --bg:#0b0f16; --fg:#e8eef8; --dim:#7d8b9e; --acc:#5fb6ff; }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent}
  html,body{height:100%;margin:0}
  body{background:radial-gradient(120% 90% at 50% 0%,#16202e 0%,#0b0f16 60%);
    color:var(--fg);font:16px/1.5 -apple-system,"PingFang SC","Microsoft YaHei",sans-serif;
    display:flex;flex-direction:column;align-items:center;padding:env(safe-area-inset-top) 18px 0;
    overflow:hidden;user-select:none}
  header{padding:22px 0 6px;text-align:center}
  header h1{margin:0;font-size:19px;font-weight:600;letter-spacing:.08em}
  #state{margin-top:4px;font-size:13px;color:var(--dim);min-height:20px}
  #stage{flex:1;display:flex;align-items:center;justify-content:center;width:100%;position:relative}
  #ring{position:relative;width:min(66vw,280px);aspect-ratio:1;border-radius:50%;
    display:flex;align-items:center;justify-content:center;
    background:radial-gradient(circle at 50% 38%,#1b2a3d,#0e1621 70%);
    box-shadow:0 0 0 1px #ffffff0f, 0 18px 60px -20px #000}
  #pulse{position:absolute;inset:-3px;border-radius:50%;border:2px solid var(--acc);opacity:.2}
  #pulse.on{animation:breathe 2.6s ease-in-out infinite}
  #pulse.talk{animation:talk .85s ease-in-out infinite}
  @keyframes breathe{0%,100%{opacity:.14;transform:scale(.98)}50%{opacity:.42;transform:scale(1.03)}}
  @keyframes talk{0%,100%{opacity:.35;transform:scale(1)}50%{opacity:.9;transform:scale(1.05)}}
  #face{width:44%;height:44%;border-radius:50%;
    background:linear-gradient(160deg,#6fc6ff,#2f7fd4);filter:saturate(.9);
    box-shadow:inset 0 -14px 30px #00000f55, 0 0 40px -6px #5fb6ff66;transition:background .3s}
  #face.sp{background:linear-gradient(160deg,#ffd08a,#f59331);
    box-shadow:inset 0 -14px 30px #00000f55, 0 0 46px -4px #ffb34788}
  #bars{position:absolute;bottom:-30px;left:0;right:0;height:20px;display:flex;
    align-items:flex-end;justify-content:center;gap:3px}
  #bars i{display:block;width:3px;height:3px;border-radius:2px;background:var(--acc);
    opacity:.55;transition:height .07s linear}
  #log{width:100%;max-width:560px;height:26vh;min-height:110px;overflow-y:auto;
    padding:8px 2px 0;font-size:14px}
  #log div{margin:6px 0;display:flex;gap:8px}
  #log .who{flex:0 0 auto;color:var(--dim);font-size:12px;padding-top:3px;width:26px}
  #log .txt{background:#ffffff0d;padding:7px 11px;border-radius:12px;max-width:82%;word-break:break-word}
  #log .me{flex-direction:row-reverse}
  #log .me .txt{background:#1d4a72}
  #log .me .who{text-align:right}
  #log .sys .txt{background:transparent;color:var(--dim);font-size:12px;padding:2px 0}
  footer{width:100%;max-width:560px;padding:10px 0 calc(18px + env(safe-area-inset-bottom));
    display:flex;flex-direction:column;gap:10px;align-items:center}
  button{-webkit-appearance:none;appearance:none;border:0;font:inherit;cursor:pointer;border-radius:999px}
  #btn{width:100%;max-width:340px;padding:17px;font-size:17px;font-weight:600;letter-spacing:.05em;
    color:#04121f;background:linear-gradient(180deg,#8fd4ff,#4aa6f0);box-shadow:0 10px 30px -12px #4aa6f088}
  #btn.hang{color:#2a0b0b;background:linear-gradient(180deg,#ff9b9b,#e85c5c);box-shadow:0 10px 30px -12px #e85c5c88}
  #btn:disabled{opacity:.45;box-shadow:none}
  #hint{font-size:12px;color:var(--dim);text-align:center;min-height:16px}
</style>
</head>
<body>
<header>
  <h1>汐</h1>
  <div id="state">未接通</div>
</header>

<div id="stage">
  <div id="ring">
    <div id="pulse"></div>
    <div id="face"></div>
    <div id="bars"><i></i><i></i><i></i><i></i><i></i><i></i><i></i></div>
  </div>
</div>

<div id="log"></div>

<footer>
  <button id="btn">接通</button>
  <div id="hint">点一下开始说话</div>
</footer>

<script>
(() => {
  const $ = s => document.querySelector(s);
  const btn = $('#btn'), stateEl = $('#state'), logEl = $('#log'),
        pulse = $('#pulse'), face = $('#face'),
        bars = [...document.querySelectorAll('#bars i')];

  let ws = null, acRec = null, acPlay = null, stream = null;
  let needDown = false, downRatio = 1, micPeak = 0, herLevel = 0;
  let playHead = 0, sources = [], connected = false, curRate = 22050;

  const LABEL = { listening: '在听你说', thinking: '在想…', speaking: '她在说', idle: '接通了' };

  function setState(s) { stateEl.textContent = s; }
  function sys(text) {
    const d = document.createElement('div');
    d.className = 'sys';
    d.innerHTML = '<span class="who">·</span><span class="txt"></span>';
    d.querySelector('.txt').textContent = text;
    logEl.appendChild(d);
    logEl.scrollTop = logEl.scrollHeight;
  }
  function append(who, text) {
    if (!text) return;
    const d = document.createElement('div');
    if (who === '你') d.className = 'me';
    d.innerHTML = `<span class="who">${who}</span><span class="txt"></span>`;
    d.querySelector('.txt').textContent = text;
    logEl.appendChild(d);
    logEl.scrollTop = logEl.scrollHeight;
    while (logEl.children.length > 60) logEl.removeChild(logEl.firstChild);
  }
  function setFace(speaking) {
    face.classList.toggle('sp', !!speaking);
    pulse.className = speaking ? 'talk' : 'on';
  }
  function drawBars(level) {
    bars.forEach((b, i) => {
      const d = Math.abs(i - 3) / 3;
      const h = Math.max(3, Math.min(20, level * 26 * (1 - d * 0.6)));
      b.style.height = h + 'px';
    });
  }

  // ---------- 上行：麦克风 → 16k PCM16 ----------
  function newRecContext() {
    try { const c = new AudioContext({ sampleRate: 16000 }); return c; }
    catch (e) { return null; }
  }
  function downsample(f, ratio) {
    const n = Math.floor(f.length / ratio), out = new Float32Array(n);
    for (let i = 0; i < n; i++) {
      const s = Math.floor(i * ratio), e = Math.min(f.length, Math.floor((i + 1) * ratio));
      let acc = 0;
      for (let j = s; j < e; j++) acc += f[j];
      out[i] = acc / Math.max(1, e - s);
    }
    return out;
  }
  function toInt16(f) {
    const buf = new ArrayBuffer(f.length * 2), v = new DataView(buf);
    for (let i = 0; i < f.length; i++) {
      let s = f[i]; s = s < -1 ? -1 : s > 1 ? 1 : s;
      v.setInt16(i * 2, s < 0 ? s * 0x8000 : s * 0x7fff, true);
    }
    return buf;
  }
  async function startMic() {
    stream = await navigator.mediaDevices.getUserMedia({
      audio: { echoCancellation: true, noiseSuppression: true, autoGainControl: true, channelCount: 1 }
    });
    acRec = newRecContext();
    if (!acRec) { acRec = new AudioContext(); needDown = true; downRatio = acRec.sampleRate / 16000; }
    await acRec.resume();
    const src = acRec.createMediaStreamSource(stream);
    const node = acRec.createScriptProcessor(2048, 1, 1);
    node.onaudioprocess = e => {
      const f = e.inputBuffer.getChannelData(0);
      let mx = 0;
      for (let i = 0; i < f.length; i++) { const v = f[i] < 0 ? -f[i] : f[i]; if (v > mx) mx = v; }
      micPeak = mx;
      if (!connected || !ws || ws.readyState !== 1) return;
      ws.send(toInt16(needDown ? downsample(f, downRatio) : f));
    };
    const mute = acRec.createGain(); mute.gain.value = 0;
    src.connect(node); node.connect(mute); mute.connect(acRec.destination);
  }

  // ---------- 下行：她说的话 ----------
  function flushPlay() {
    sources.forEach(s => { try { s.stop(); } catch (e) {} });
    sources = []; playHead = 0;
  }
  function enqueue(ab, rate) {
    if (!acPlay) acPlay = new AudioContext();
    if (acPlay.state === 'suspended') acPlay.resume();
    const i16 = new Int16Array(ab);
    const f32 = new Float32Array(i16.length);
    for (let i = 0; i < i16.length; i++) f32[i] = i16[i] / 32768;
    const buf = acPlay.createBuffer(1, f32.length, rate || curRate);
    buf.copyToChannel(f32, 0);
    const s = acPlay.createBufferSource();
    s.buffer = buf; s.connect(acPlay.destination);
    const now = acPlay.currentTime;
    if (playHead < now + 0.06) playHead = now + 0.06;
    s.start(playHead);
    playHead += buf.duration;
    sources.push(s);
    s.onended = () => { sources = sources.filter(x => x !== s); };
  }

  // ---------- 接 / 挂 ----------
  function wsUrl() {
    return (location.protocol === 'https:' ? 'wss://' : 'ws://') + location.host + '/ws';
  }
  async function connect() {
    btn.disabled = true;
    setState('正在接通…');
    try {
      await startMic();
    } catch (e) {
      setState('拿不到麦克风');
      sys('浏览器不给麦克风：' + (e.message || e.name) + '（要 https 或者 localhost）');
      btn.disabled = false; return;
    }
    ws = new WebSocket(wsUrl());
    ws.binaryType = 'arraybuffer';
    ws.onopen = () => {
      connected = true;
      btn.disabled = false;
      btn.textContent = '挂断';
      btn.classList.add('hang');
      setState('接通了');
      setFace(false);
      $('#hint').textContent = '说话就行；她说话的时候你也能直接插话';
      ws.send(JSON.stringify({ t: 'hi', rate: acRec.sampleRate }));
    };
    ws.onmessage = ev => {
      if (typeof ev.data === 'string') {
        let j; try { j = JSON.parse(ev.data); } catch (e) { return; }
        if (j.t === 'state') {
          setState(LABEL[j.state] || j.state);
          setFace(j.state === 'speaking');
        } else if (j.t === 'heard') {
          append('你', j.text);
        } else if (j.t === 'reply') {
          append('汐', j.text);
        } else if (j.t === 'say_start') {
          curRate = j.rate || 22050;
        } else if (j.t === 'say_end') {
          if (j.interrupted) { flushPlay(); sys('（你打断了）'); }
          setFace(false);
        } else if (j.t === 'error') {
          sys('出错：' + j.msg);
        }
        return;
      }
      enqueue(ev.data, curRate);
    };
    ws.onclose = () => {
      connected = false;
      setFace(false); flushPlay();
      btn.textContent = '接通'; btn.classList.remove('hang'); btn.disabled = false;
      $('#hint').textContent = '点一下重新接通';
      if (stateEl.textContent !== '已挂断') setState('断开了');
    };
    ws.onerror = () => setState('连接出错');
  }
  function hangup() {
    connected = false;
    if (ws) { try { ws.close(); } catch (e) {} ws = null; }
    if (stream) { stream.getTracks().forEach(t => t.stop()); stream = null; }
    if (acRec) { try { acRec.close(); } catch (e) {} acRec = null; }
    flushPlay();
    setState('已挂断');
    btn.textContent = '接通'; btn.classList.remove('hang');
    $('#hint').textContent = '点一下重新接通';
  }
  btn.onclick = () => { if (connected) hangup(); else connect(); };

  setInterval(() => {
    if (!connected) { drawBars(0); return; }
    const playing = sources.length > 0;
    drawBars(playing ? Math.max(micPeak, 0.28) : micPeak);
    micPeak *= 0.55;
  }, 60);

  window.addEventListener('beforeunload', () => { if (connected) hangup(); });
})();
</script>
</body>
</html>
